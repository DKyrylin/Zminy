<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CRM</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<style>
:root{--bg:#f4f4f7;--card:#fff;--primary:#007aff;--text:#1c1c1e;--text2:#8e8e93;--border:#d1d1d6;--radius:14px;--danger:#ff3b30;--green:#34c759;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px;}

.header{background:var(--card);padding:44px 16px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;}
.header h1{font-size:20px;font-weight:800;}
.sync-badge{font-size:10px;padding:5px 10px;border-radius:20px;font-weight:700;background:#e2f9e1;color:#28a745;}

.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;padding:8px 0 28px;z-index:1000;}
.nav-item{flex:1;border:none;background:none;color:var(--text2);font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;}
.nav-item .nav-icon{font-size:20px;}
.nav-item.active{color:var(--primary);}

.page{display:none;padding:12px;}
.page.active{display:block;}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}

input,select{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:#f9f9f9;color:var(--text);outline:none;-webkit-appearance:none;margin-bottom:8px;}
input:focus,select:focus{border-color:var(--primary);background:#fff;}

.btn{padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
.btn:active{opacity:0.75;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-ghost{background:#e5e5ea;color:var(--text);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:9px 13px;font-size:12px;width:auto;border-radius:9px;}

.sec-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin:14px 0 6px 2px;}

.cat-header{background:#e5e5ea;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:800;margin:12px 0 6px;color:#333;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.cat-header::after{content:'▼';font-size:10px;color:var(--text2);}
.cat-header.collapsed::after{content:'▶';}
.cat-list.collapsed{display:none;}

.prod-row{display:flex;align-items:center;padding:10px;margin-bottom:6px;}
.drag-handle{color:#ccc;font-size:20px;padding:4px 10px 4px 0;cursor:grab;flex-shrink:0;}
.prod-info{flex:1;}
.prod-name{font-size:14px;font-weight:700;}
.prod-sub{font-size:12px;color:var(--text2);margin-top:2px;}
.prod-actions{display:flex;gap:6px;}

.search-wrap{position:relative;}
.search-results{background:#fff;border:1.5px solid var(--border);border-radius:12px;max-height:240px;overflow-y:auto;position:absolute;width:100%;z-index:1000;box-shadow:0 6px 20px rgba(0,0,0,0.12);top:calc(100% + 4px);}
.search-item{padding:12px 16px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;font-size:14px;}
.search-item:last-child{border-bottom:none;}
.search-item:active{background:#f4f4f7;}

/* COMPACT INVOICE */
.inv-header-grid{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;margin-bottom:8px;}
.inv-header-grid input{margin-bottom:0;padding:9px 10px;font-size:14px;}
.inv-field-label{font-size:10px;color:var(--text2);font-weight:600;margin-bottom:3px;}

.inv-table{width:100%;border-collapse:collapse;}
.inv-table th{font-size:10px;color:var(--text2);background:#f4f4f7;padding:6px 3px;font-weight:700;}
.inv-table td{padding:8px 3px;border-bottom:1px solid #f0f0f0;text-align:center;font-size:13px;}
.qty-input{width:56px;padding:8px 4px!important;text-align:center;border:1.5px solid var(--primary)!important;font-weight:700;margin:0!important;font-size:15px;border-radius:8px!important;}

.total-bar{background:#1c1c1e;color:#fff;padding:14px 16px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.total-val{font-size:18px;font-weight:800;}

/* HISTORY */
.hist-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
.hist-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.hist-num{font-size:15px;font-weight:800;}
.hist-sum{font-size:15px;font-weight:800;color:var(--primary);}
.hist-sub{font-size:12px;color:var(--text2);}
.hist-actions{display:flex;gap:8px;margin-top:10px;}

/* БАГАЖНИК */
.trunk-total{background:#1c1c1e;color:#fff;padding:14px 16px;border-radius:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.trunk-total-label{font-size:13px;font-weight:600;}
.trunk-total-val{font-size:20px;font-weight:800;}

.trunk-item{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);user-select:none;-webkit-user-select:none;}
.trunk-item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.trunk-item-name{font-size:16px;font-weight:800;color:var(--text);flex:1;padding-right:10px;}
.trunk-item-qty{font-size:18px;font-weight:800;color:var(--primary);white-space:nowrap;}
.trunk-item-btns{display:flex;gap:10px;margin-bottom:6px;}
.trunk-btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:22px;font-weight:700;cursor:pointer;background:#e5e5ea;color:var(--text);}
.trunk-btn:active{opacity:0.6;}
.trunk-btn-minus{background:#ffe5e5;color:var(--danger);}
.trunk-btn-plus{background:#e5f9ee;color:var(--green);}
.trunk-item-meta{display:flex;justify-content:space-between;align-items:center;}
.trunk-item-sku{font-size:11px;color:var(--text2);}
.trunk-item-price-unit{font-size:11px;color:var(--text2);}
.trunk-item-total{font-size:13px;font-weight:700;color:var(--text);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:2000;backdrop-filter:blur(4px);}
.modal-win{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px 20px 40px;max-height:90vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:#d1d1d6;border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:16px;}
.hidden{display:none;}

.edit-banner{background:#ff9500;color:#fff;padding:10px;text-align:center;border-radius:10px;margin-bottom:10px;font-size:13px;font-weight:700;}

.sortable-ghost{opacity:0.3;background:var(--primary)!important;}

/* TOAST */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1c1c1e;color:#fff;padding:12px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="header">
  <h1 id="page-title">Склад</h1>
  <span class="sync-badge" id="syncBadge">● Хмара</span>
</div>

<!-- СКЛАД -->
<div id="page-goods" class="page active">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:15px;font-weight:800">Додати товар</div>
      <button class="btn btn-ghost btn-sm" onclick="openCatManager()">Групи ⚙️</button>
    </div>
    <input type="hidden" id="edit-id">
    <select id="g-cat"></select>
    <input type="text" id="g-name" placeholder="Назва товару">
    <div style="display:grid;grid-template-columns:1fr 1fr 64px;gap:8px">
      <input type="text" id="g-sku" placeholder="Артикул" style="margin-bottom:0">
      <input type="number" id="g-price" placeholder="Ціна ₴" inputmode="decimal" style="margin-bottom:0">
      <input type="text" id="g-unit" value="шт" style="margin-bottom:0;text-align:center">
    </div>
    <div style="height:8px"></div>
    <button class="btn btn-primary" onclick="saveProduct()">Зберегти</button>
    <button class="btn btn-ghost hidden" id="btn-cancel-edit" onclick="cancelEdit()" style="margin-top:8px">Скасувати</button>
  </div>
  <div id="goods-container"></div>
</div>

<!-- НАКЛАДНА -->
<div id="page-invoice" class="page">
  <div id="edit-banner" class="edit-banner hidden">✏️ РЕДАГУВАННЯ НАКЛАДНОЇ</div>
  <div class="card">
    <div class="inv-header-grid">
      <div><div class="inv-field-label">№</div><input type="text" id="inv-num" style="margin-bottom:0"></div>
      <div><div class="inv-field-label">Дата</div><input type="date" id="inv-date" style="margin-bottom:0"></div>
      <div><div class="inv-field-label">Клієнт</div><input type="text" id="inv-client" placeholder="ПІБ" style="margin-bottom:0"></div>
    </div>
    <div style="height:8px"></div>
    <div class="search-wrap">
      <input type="text" id="inv-search" placeholder="🔍 Пошук товару..." oninput="searchInv(this.value)" style="margin-bottom:0">
      <div id="inv-sres" class="search-results hidden"></div>
    </div>
  </div>
  <div class="card" style="padding:8px">
    <table class="inv-table">
      <thead><tr>
        <th style="width:24px"></th>
        <th style="text-align:left;padding-left:4px">Назва</th>
        <th style="width:64px">К-сть</th>
        <th style="width:58px">Сума</th>
        <th style="width:24px"></th>
      </tr></thead>
      <tbody id="inv-items"></tbody>
    </table>
    <div id="inv-tot-wrap" class="hidden">
      <div class="total-bar">
        <span style="font-size:13px;font-weight:600">РАЗОМ</span>
        <span class="total-val" id="inv-total-val">0.00 ₴</span>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-ghost hidden" id="btn-cancel-inv-edit" onclick="resetInvoicePage()" style="flex:1">Скасувати</button>
        <button class="btn btn-primary" onclick="openPreview()" style="flex:2">Переглянути →</button>
      </div>
    </div>
  </div>
</div>

<!-- ЖУРНАЛ -->
<div id="page-history" class="page">
  <div id="hist-list"></div>
</div>

<!-- БАГАЖНИК -->
<div id="page-trunk" class="page">
  <div class="trunk-total">
    <span class="trunk-total-label">У БАГАЖНИКУ</span>
    <span class="trunk-total-val" id="trunk-total">0 ₴</span>
  </div>
  <button class="btn btn-primary" onclick="openTrunkAdd()" style="margin-bottom:14px">+ Додати товар</button>
  <div id="trunk-list"></div>
</div>

<!-- NAV -->
<div class="nav-bar">
  <button class="nav-item active" onclick="showPage('goods',this)"><span class="nav-icon">📦</span>Склад</button>
  <button class="nav-item" onclick="showPage('invoice',this)"><span class="nav-icon">🧾</span><span id="nav-inv-label">Накладна</span></button>
  <button class="nav-item" onclick="showPage('history',this)"><span class="nav-icon">📋</span>Журнал</button>
  <button class="nav-item" onclick="showPage('trunk',this)"><span class="nav-icon">🚗</span>Багажник</button>
</div>

<!-- CATEGORY MODAL -->
<div id="category-modal" class="modal-overlay hidden" onclick="closeCatIfOutside(event)">
  <div class="modal-win">
    <div class="modal-handle"></div>
    <div class="modal-title">Групи товарів</div>
    <div id="cat-manager-list" style="margin-bottom:16px"></div>
    <div style="display:flex;gap:8px">
      <input type="text" id="new-cat-name" placeholder="Нова група" style="margin-bottom:0;flex:1">
      <button class="btn btn-primary btn-sm" onclick="addCategory()" style="white-space:nowrap">+ Додати</button>
    </div>
    <button class="btn btn-ghost" onclick="closeCatManager()" style="margin-top:12px">Закрити</button>
  </div>
</div>

<!-- PREVIEW MODAL -->
<div id="preview-modal" class="modal-overlay hidden">
  <div class="modal-win">
    <div class="modal-handle"></div>
    <div class="modal-title">Перегляд накладної</div>
    <div id="pre-content"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-ghost" onclick="closePreview()" style="flex:1">← Назад</button>
      <button class="btn btn-green" onclick="saveInvoice()" style="flex:1">Зберегти</button>
      <button class="btn btn-primary" onclick="openPDF()" style="flex:1">PDF ↗</button>
    </div>
  </div>
</div>

<!-- TRUNK ADD MODAL -->
<div id="trunk-modal" class="modal-overlay hidden" onclick="closeTrunkIfOutside(event)">
  <div class="modal-win">
    <div class="modal-handle"></div>
    <div class="modal-title">Додати в багажник</div>
    <div class="search-wrap">
      <input type="text" id="trunk-search" placeholder="🔍 Пошук товару..." oninput="searchTrunk(this.value)">
      <div id="trunk-sres" class="search-results hidden"></div>
    </div>
    <button class="btn btn-ghost" onclick="closeTrunkModal()" style="margin-top:4px">Закрити</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyBqEFr1Zl-uM-eb58tB_tMgYIgISsfKoiM",authDomain:"crmkyrylin.firebaseapp.com",databaseURL:"https://crmkyrylin-default-rtdb.europe-west1.firebasedatabase.app",projectId:"crmkyrylin",storageBucket:"crmkyrylin.firebasestorage.app",messagingSenderId:"855766374550",appId:"1:855766374550:web:337edb41aa7ce2ab274ab7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let products=[],categories=["Тенти","Бар'єри","Безпека","Без категорії"];
let invoiceItems=[],invoiceHistory=[],editingInvoiceId=null;
let collapsedCats={},currentInvoiceData=null;
let trunkItems={};

// ── SYNC ──────────────────────────────────────────────────────────────────
db.ref('products').on('value',snap=>{
  products=snap.val()?Object.values(snap.val()).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)):[];
  renderGoods();
});
db.ref('categories').on('value',snap=>{
  if(snap.val())categories=snap.val();
  renderGoods();
});
db.ref('history').on('value',snap=>{
  invoiceHistory=snap.val()?Object.values(snap.val()).sort((a,b)=>b.id-a.id):[];
  renderHistory();
});
db.ref('trunk').on('value',snap=>{
  trunkItems=snap.val()||{};
  renderTrunk();
});
db.ref('.info/connected').on('value',snap=>{
  const el=document.getElementById('syncBadge');
  el.textContent=snap.val()?'● Хмара':'○ Офлайн';
  el.style.background=snap.val()?'#e2f9e1':'#fff3cd';
  el.style.color=snap.val()?'#28a745':'#856404';
});

// ── СКЛАД ─────────────────────────────────────────────────────────────────
function renderGoods(){
  const container=document.getElementById('goods-container');
  container.innerHTML='';
  const sel=document.getElementById('g-cat');
  const prev=sel.value;
  sel.innerHTML=categories.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(prev)sel.value=prev;
  categories.forEach((cat,ci)=>{
    const catProds=products.filter(p=>(p.cat||'Без категорії')===cat);
    const hdr=document.createElement('div');
    hdr.className=`cat-header${collapsedCats[cat]?' collapsed':''}`;
    hdr.innerHTML=`<span>${cat} <span style="font-weight:400;color:var(--text2)">(${catProds.length})</span></span>`;
    const list=document.createElement('div');
    list.className=`cat-list${collapsedCats[cat]?' collapsed':''}`;
    list.id=`cl-${ci}`;
    hdr.onclick=()=>{const c=list.classList.toggle('collapsed');hdr.classList.toggle('collapsed',c);collapsedCats[cat]=c;};
    catProds.forEach(p=>{
      const el=document.createElement('div');
      el.className='card prod-row';el.dataset.id=p.id;
      el.innerHTML=`<span class="drag-handle">⠿</span><div class="prod-info"><div class="prod-name">${p.name}</div><div class="prod-sub">${p.price} ₴ · ${p.unit||'шт'}${p.sku?' · '+p.sku:''}</div></div><div class="prod-actions"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editProd('${p.id}')">✏️</button><button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteProd('${p.id}')">✕</button></div>`;
      list.appendChild(el);
    });
    container.appendChild(hdr);container.appendChild(list);
    new Sortable(list,{handle:'.drag-handle',animation:150,ghostClass:'sortable-ghost',onEnd:saveOrder});
  });
}

function saveOrder(){document.querySelectorAll('#goods-container .prod-row').forEach((el,i)=>db.ref('products/'+el.dataset.id).update({sortOrder:i}));}

function saveProduct(){
  const id=document.getElementById('edit-id').value||Date.now().toString();
  const name=document.getElementById('g-name').value.trim();
  const price=parseFloat(document.getElementById('g-price').value);
  if(!name||isNaN(price))return;
  const existing=products.find(x=>x.id===id);
  db.ref('products/'+id).update({id,name,price,unit:document.getElementById('g-unit').value||'шт',sku:document.getElementById('g-sku').value,cat:document.getElementById('g-cat').value,sortOrder:existing?(existing.sortOrder||0):products.length});
  cancelEdit();showToast('✓ Товар збережено');
}
function deleteProd(id){if(confirm('Видалити товар?'))db.ref('products/'+id).remove();}
function editProd(id){
  const p=products.find(x=>x.id==id);
  document.getElementById('edit-id').value=p.id;
  document.getElementById('g-name').value=p.name;
  document.getElementById('g-price').value=p.price;
  document.getElementById('g-sku').value=p.sku||'';
  document.getElementById('g-unit').value=p.unit||'шт';
  document.getElementById('g-cat').value=p.cat;
  document.getElementById('btn-cancel-edit').classList.remove('hidden');
  showPage('goods',document.querySelectorAll('.nav-item')[0]);
  window.scrollTo(0,0);
}
function cancelEdit(){
  document.getElementById('edit-id').value='';document.getElementById('g-name').value='';
  document.getElementById('g-price').value='';document.getElementById('g-sku').value='';
  document.getElementById('btn-cancel-edit').classList.add('hidden');
}

// ── КАТЕГОРІЇ ─────────────────────────────────────────────────────────────
function openCatManager(){
  document.getElementById('cat-manager-list').innerHTML=categories.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0"><span style="font-size:15px">${c}</span><button class="btn btn-danger btn-sm" onclick="deleteCat('${c}')">✕</button></div>`).join('');
  document.getElementById('category-modal').classList.remove('hidden');
}
function addCategory(){const n=document.getElementById('new-cat-name').value.trim();if(n&&!categories.includes(n)){categories.push(n);db.ref('categories').set(categories);document.getElementById('new-cat-name').value='';openCatManager();}}
function deleteCat(c){if(confirm('Видалити групу?')){categories=categories.filter(x=>x!==c);db.ref('categories').set(categories);openCatManager();}}
function closeCatManager(){document.getElementById('category-modal').classList.add('hidden');}
function closeCatIfOutside(e){if(e.target===document.getElementById('category-modal'))closeCatManager();}

// ── НАКЛАДНА ──────────────────────────────────────────────────────────────
function searchInv(val){
  const res=document.getElementById('inv-sres');
  if(!val){res.classList.add('hidden');return;}
  const f=products.filter(p=>p.name.toLowerCase().includes(val.toLowerCase())||(p.sku&&p.sku.toLowerCase().includes(val.toLowerCase())));
  res.innerHTML=f.map(p=>`<div class="search-item" onclick="addInvItem('${p.id}')"><span>${p.name}${p.sku?'<br><small style="color:var(--text2)">'+p.sku+'</small>':''}</span><b style="color:var(--primary)">${p.price} ₴</b></div>`).join('');
  res.classList.remove('hidden');
}
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))document.getElementById('inv-sres').classList.add('hidden');});

function addInvItem(id){
  const p=products.find(x=>x.id==id);
  invoiceItems.push({...p,tempId:Date.now(),qty:1});
  document.getElementById('inv-search').value='';
  document.getElementById('inv-sres').classList.add('hidden');
  renderInvoice();updateNavLabel();
}

function renderInvoice(){
  const body=document.getElementById('inv-items');
  body.innerHTML=invoiceItems.map(it=>`<tr data-tid="${it.tempId}"><td class="drag-handle" style="color:#ccc;font-size:18px;cursor:grab">⠿</td><td style="text-align:left;font-size:12px;font-weight:600">${it.name}${it.sku?'<br><span style="font-size:10px;color:var(--text2)">'+it.sku+'</span>':''}</td><td><input type="number" class="qty-input" value="${it.qty}" inputmode="decimal" oninput="updateQty(${it.tempId},this.value)"></td><td style="font-weight:700;font-size:13px" class="row-total">${(it.price*it.qty).toFixed(0)}</td><td onclick="removeInvItem(${it.tempId})" style="color:var(--danger);font-size:18px;font-weight:700;cursor:pointer">✕</td></tr>`).join('');
  updateInvoiceTotal();
  new Sortable(body,{handle:'.drag-handle',animation:150,onEnd:evt=>{const m=invoiceItems.splice(evt.oldIndex,1)[0];invoiceItems.splice(evt.newIndex,0,m);}});
}

function updateQty(tid,val){
  const it=invoiceItems.find(x=>x.tempId==tid);
  if(it){it.qty=parseFloat(val)||0;const row=document.querySelector(`tr[data-tid="${tid}"]`);if(row)row.querySelector('.row-total').innerText=(it.price*it.qty).toFixed(0);updateInvoiceTotal();}
}
function updateInvoiceTotal(){
  const total=invoiceItems.reduce((s,x)=>s+(x.price*x.qty),0);
  document.getElementById('inv-total-val').innerText=total.toFixed(2)+' ₴';
  document.getElementById('inv-tot-wrap').classList.toggle('hidden',invoiceItems.length===0);
}
function removeInvItem(tid){invoiceItems=invoiceItems.filter(x=>x.tempId!=tid);renderInvoice();updateNavLabel();}
function updateNavLabel(){document.getElementById('nav-inv-label').textContent=invoiceItems.length>0?`Накладна (${invoiceItems.length})`:'Накладна';}

// ── PREVIEW ───────────────────────────────────────────────────────────────
function openPreview(){
  const num=document.getElementById('inv-num').value||'1';
  const dateRaw=document.getElementById('inv-date').value;
  const date=dateRaw.split('-').reverse().join('.');
  const client=document.getElementById('inv-client').value||'—';
  const total=invoiceItems.reduce((s,x)=>s+x.price*x.qty,0);
  currentInvoiceData={num,date,client,total,items:invoiceItems.map(x=>({...x})),id:editingInvoiceId||Date.now().toString()};
  let rows='';
  currentInvoiceData.items.forEach(it=>{rows+=`<tr><td style="padding:8px 4px;border-bottom:1px solid #eee;text-align:left;font-size:13px">${it.name}${it.sku?'<br><span style="font-size:10px;color:var(--text2)">'+it.sku+'</span>':''}</td><td style="padding:8px 4px;border-bottom:1px solid #eee;text-align:center;font-size:13px;white-space:nowrap">${it.qty} ${it.unit||'шт'}</td><td style="padding:8px 4px;border-bottom:1px solid #eee;text-align:right;font-size:13px;font-weight:700;white-space:nowrap">${(it.qty*it.price).toFixed(0)} ₴</td></tr>`;});
  document.getElementById('pre-content').innerHTML=`<div style="border-bottom:2px solid #1c1c1e;padding-bottom:12px;margin-bottom:14px;text-align:center"><div style="font-size:17px;font-weight:800">ВИДАТКОВА НАКЛАДНА</div><div style="font-size:13px;color:var(--text2);margin-top:4px">№ ${num} · ${date}</div></div><div style="font-size:14px;margin-bottom:14px;padding:10px 12px;background:#f4f4f7;border-radius:10px"><span style="color:var(--text2);font-size:12px">Отримувач</span><br><b>${client}</b></div><table style="width:100%;border-collapse:collapse"><thead><tr style="background:#f4f4f7"><th style="padding:7px 4px;text-align:left;font-size:11px;color:var(--text2)">Назва</th><th style="padding:7px 4px;text-align:center;font-size:11px;color:var(--text2);width:64px">К-сть</th><th style="padding:7px 4px;text-align:right;font-size:11px;color:var(--text2);width:72px">Сума</th></tr></thead><tbody>${rows}</tbody></table><div style="background:#1c1c1e;color:#fff;padding:14px 16px;border-radius:12px;margin-top:14px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:14px;font-weight:600">РАЗОМ</span><span style="font-size:20px;font-weight:800">${total.toFixed(2)} ₴</span></div>`;
  document.getElementById('preview-modal').classList.remove('hidden');
}
function closePreview(){document.getElementById('preview-modal').classList.add('hidden');}

function saveInvoice(){
  if(!currentInvoiceData)return;
  db.ref('history/'+currentInvoiceData.id).set(currentInvoiceData);
  if(!editingInvoiceId)document.getElementById('inv-num').value=parseInt(currentInvoiceData.num)+1;
  resetInvoicePage();closePreview();
  showPage('history',document.querySelectorAll('.nav-item')[2]);
  showToast('✓ Накладну збережено');
}

function openPDF(){
  if(!currentInvoiceData)return;
  db.ref('history/'+currentInvoiceData.id).set(currentInvoiceData);
  if(!editingInvoiceId)document.getElementById('inv-num').value=parseInt(currentInvoiceData.num)+1;

  const dd={
    pageSize:'A4',pageMargins:[40,40,40,40],
    content:[
      {text:'ВИДАТКОВА НАКЛАДНА',fontSize:18,bold:true,alignment:'center',margin:[0,0,0,6]},
      {text:`№ ${currentInvoiceData.num} від ${currentInvoiceData.date}`,fontSize:12,alignment:'center',color:'#666',margin:[0,0,0,20]},
      {table:{widths:['auto','*'],body:[[{text:'Отримувач:',bold:true,border:[0,0,0,0]},{text:currentInvoiceData.client,border:[0,0,0,0]}]]},layout:'noBorders',margin:[0,0,0,20]},
      {table:{headerRows:1,widths:[20,40,'*',55,55,65],body:[
        [{text:'№',bold:true,fillColor:'#f4f4f7',alignment:'center'},{text:'Арт.',bold:true,fillColor:'#f4f4f7'},{text:'Назва',bold:true,fillColor:'#f4f4f7'},{text:'К-сть',bold:true,fillColor:'#f4f4f7',alignment:'center'},{text:'Ціна',bold:true,fillColor:'#f4f4f7',alignment:'right'},{text:'Сума',bold:true,fillColor:'#f4f4f7',alignment:'right'}],
        ...currentInvoiceData.items.map((it,i)=>[{text:i+1,alignment:'center'},it.sku||'—',it.name,{text:`${it.qty} ${it.unit||'шт'}`,alignment:'center'},{text:it.price.toFixed(2),alignment:'right'},{text:(it.qty*it.price).toFixed(2),alignment:'right'}])
      ]},layout:'lightHorizontalLines'},
      {text:`\nРАЗОМ: ${currentInvoiceData.total.toFixed(2)} грн`,fontSize:14,bold:true,alignment:'right',margin:[0,10,0,0]}
    ],
    defaultStyle:{fontSize:11}
  };

  // Назва файлу N1_110626
  const d=currentInvoiceData.date.replace(/\./g,'');
  const fileName=`N${currentInvoiceData.num}_${d}.pdf`;

  pdfMake.createPdf(dd).download(`Nakl${currentInvoiceData.num}.pdf`);

  resetInvoicePage();closePreview();
  showPage('history',document.querySelectorAll('.nav-item')[2]);
  showToast('✓ PDF збережено');
}

// ── ЖУРНАЛ ────────────────────────────────────────────────────────────────
function renderHistory(){
  const list=document.getElementById('hist-list');
  if(!invoiceHistory.length){list.innerHTML='<div style="text-align:center;color:var(--text2);padding:40px;font-size:14px">Накладних поки немає</div>';return;}
  list.innerHTML=invoiceHistory.map(h=>`<div class="hist-card"><div class="hist-top"><span class="hist-num">№${h.num} — ${h.client}</span><span class="hist-sum">${parseFloat(h.total).toFixed(0)} ₴</span></div><div class="hist-sub">${h.date} · ${h.items.length} позицій</div><div class="hist-actions"><button class="btn btn-ghost btn-sm" onclick="editHistory('${h.id}')" style="flex:1">✏️ Редагувати</button><button class="btn btn-primary btn-sm" onclick="histPDF('${h.id}')" style="flex:1">PDF ↗</button></div></div>`).join('');
}

function editHistory(id){
  const h=invoiceHistory.find(x=>x.id==id);
  if(!h)return;
  editingInvoiceId=h.id;
  document.getElementById('inv-num').value=h.num;
  document.getElementById('inv-client').value=h.client;
  invoiceItems=h.items.map(it=>({...it,tempId:Math.random()}));
  document.getElementById('edit-banner').classList.remove('hidden');
  document.getElementById('btn-cancel-inv-edit').classList.remove('hidden');
  showPage('invoice',document.querySelectorAll('.nav-item')[1]);
  renderInvoice();updateNavLabel();
}

function histPDF(id){
  const h=invoiceHistory.find(x=>x.id==id);
  if(!h)return;
  // Заповнюємо поля накладної з журналу і відкриваємо превью
  editingInvoiceId=h.id;
  invoiceItems=h.items.map(it=>({...it,tempId:Math.random()}));
  const dateFormatted=h.date.split('.').reverse().join('-');
  document.getElementById('inv-num').value=h.num;
  document.getElementById('inv-date').value=dateFormatted;
  document.getElementById('inv-client').value=h.client;
  openPreview();
}

function resetInvoicePage(){
  editingInvoiceId=null;invoiceItems=[];
  document.getElementById('inv-client').value='';
  document.getElementById('inv-search').value='';
  document.getElementById('edit-banner').classList.add('hidden');
  document.getElementById('btn-cancel-inv-edit').classList.add('hidden');
  renderInvoice();updateNavLabel();
}

// ── БАГАЖНИК ──────────────────────────────────────────────────────────────
function renderTrunk(){
  const list=document.getElementById('trunk-list');
  const keys=Object.keys(trunkItems);
  if(!keys.length){list.innerHTML='<div style="text-align:center;color:var(--text2);padding:40px;font-size:14px">Багажник порожній</div>';document.getElementById('trunk-total').textContent='0 ₴';return;}
  let total=0;
  list.innerHTML=keys.map(pid=>{
    const ti=trunkItems[pid];
    const p=products.find(x=>x.id==pid)||{name:ti.name,price:ti.price,sku:ti.sku,unit:ti.unit||'шт'};
    const lineTotal=p.price*ti.qty;
    total+=lineTotal;
    return `<div class="trunk-item">
      <div class="trunk-item-top">
        <div class="trunk-item-name">${p.name}</div>
        <div class="trunk-item-qty">${ti.qty} ${p.unit||'шт'}</div>
      </div>
      <div class="trunk-item-btns">
        <button class="trunk-btn trunk-btn-minus" onclick="trunkChange('${pid}',-1)">−</button>
        <button class="trunk-btn trunk-btn-plus" onclick="trunkChange('${pid}',1)">+</button>
      </div>
      <div class="trunk-item-meta">
        <span class="trunk-item-sku">${p.sku?'Арт: '+p.sku:''} · ${p.price} ₴/шт</span>
        <span class="trunk-item-total">${lineTotal.toFixed(0)} ₴</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('trunk-total').textContent=total.toFixed(0)+' ₴';
}

function trunkChange(pid,delta){
  const ti=trunkItems[pid];
  if(!ti)return;
  const newQty=Math.max(0,(ti.qty||0)+delta);
  if(newQty===0){if(confirm('Видалити з багажника?'))db.ref('trunk/'+pid).remove();}
  else db.ref('trunk/'+pid).update({qty:newQty});
}

function openTrunkAdd(){document.getElementById('trunk-modal').classList.remove('hidden');}
function closeTrunkModal(){document.getElementById('trunk-modal').classList.add('hidden');document.getElementById('trunk-search').value='';document.getElementById('trunk-sres').classList.add('hidden');}
function closeTrunkIfOutside(e){if(e.target===document.getElementById('trunk-modal'))closeTrunkModal();}

function searchTrunk(val){
  const res=document.getElementById('trunk-sres');
  if(!val){res.classList.add('hidden');return;}
  const f=products.filter(p=>p.name.toLowerCase().includes(val.toLowerCase())||(p.sku&&p.sku.toLowerCase().includes(val.toLowerCase())));
  res.innerHTML=f.map(p=>`<div class="search-item" onclick="addToTrunk('${p.id}')"><span>${p.name}${p.sku?'<br><small style="color:var(--text2)">'+p.sku+'</small>':''}</span><b style="color:var(--primary)">${p.price} ₴</b></div>`).join('');
  res.classList.remove('hidden');
}

function addToTrunk(pid){
  const p=products.find(x=>x.id==pid);
  if(!p)return;
  const existing=trunkItems[pid];
  db.ref('trunk/'+pid).set({name:p.name,price:p.price,sku:p.sku||'',unit:p.unit||'шт',qty:(existing?existing.qty:0)+1});
  closeTrunkModal();
  showToast('✓ Додано в багажник');
}

// ── NAV & UTILS ───────────────────────────────────────────────────────────
function showPage(p,btn){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(btn)btn.classList.add('active');
  document.getElementById('page-title').innerText={goods:'Склад',invoice:'Накладна',history:'Журнал',trunk:'Багажник'}[p];
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

document.getElementById('inv-date').value=new Date().toISOString().split('T')[0];
document.getElementById('inv-num').value='1';
</script>
</body>
