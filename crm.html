<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CRM</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<style>
:root{
  --bg:#fafafa;
  --card:#fff;
  --border:#e8e8e8;
  --border2:#f0f0f0;
  --primary:#007aff;
  --text:#000;
  --text2:#6e6e73;
  --text3:#aeaeb2;
  --danger:#ff3b30;
  --green:#34c759;
  --orange:#ff9500;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);padding-bottom:84px;min-height:100vh;}

/* HEADER */
.header{background:rgba(250,250,250,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:52px 20px 12px;border-bottom:0.5px solid var(--border);position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:flex-end;}
.header-title{font-size:28px;font-weight:700;letter-spacing:-0.5px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-bottom:6px;flex-shrink:0;}
.sync-dot.offline{background:var(--text3);}

/* NAV */
.nav-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(250,250,250,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:0.5px solid var(--border);display:flex;padding:8px 0 24px;z-index:1000;}
.nav-item{flex:1;border:none;background:none;color:var(--text3);font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;transition:color 0.15s;}
.nav-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-item.active{color:var(--primary);}

/* PAGES */
.page{display:none;padding:16px 16px 8px;}
.page.active{display:block;}

/* SECTION */
.section-header{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;padding:0 4px;margin:20px 0 8px;}
.section-header:first-child{margin-top:4px;}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);margin-bottom:1px;overflow:hidden;}
.card-group{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);margin-bottom:16px;overflow:hidden;}
.card-group .card-row:last-child{border-bottom:none;}

.card-row{display:flex;align-items:center;padding:13px 16px;border-bottom:0.5px solid var(--border2);transition:background 0.1s;}
.card-row:active{background:#f5f5f5;}
.card-row-label{font-size:15px;color:var(--text2);flex-shrink:0;width:90px;}
.card-row-value{flex:1;font-size:15px;color:var(--text);}

/* INPUTS */
input,select{width:100%;padding:0;border:none;border-radius:0;font-size:15px;background:transparent;color:var(--text);outline:none;-webkit-appearance:none;font-family:inherit;}
select{color:var(--text);}

.input-group{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);margin-bottom:16px;overflow:hidden;}
.input-row{display:flex;align-items:center;padding:13px 16px;border-bottom:0.5px solid var(--border2);}
.input-row:last-child{border-bottom:none;}
.input-label{font-size:15px;color:var(--text2);flex-shrink:0;width:90px;}
.input-row input,.input-row select{flex:1;}

/* BUTTONS */
.btn{padding:15px 20px;border-radius:var(--radius);border:none;font-size:15px;font-weight:600;cursor:pointer;width:100%;font-family:inherit;transition:opacity 0.15s;}
.btn:active{opacity:0.7;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-green{background:var(--green);color:#fff;}
.btn-ghost{background:var(--card);color:var(--primary);border:0.5px solid var(--border);}
.btn-danger-ghost{background:var(--card);color:var(--danger);border:0.5px solid var(--border);}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;border-radius:9px;}

/* CAT HEADER */
.cat-section{margin-bottom:16px;}
.cat-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.5px;padding:0 4px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.cat-title-count{font-size:12px;font-weight:400;color:var(--text3);}

/* PRODUCT ROW */
.prod-item{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);margin-bottom:1px;display:flex;align-items:center;padding:12px 14px;gap:12px;}
.drag-handle{color:var(--text3);font-size:18px;cursor:grab;flex-shrink:0;padding:2px;}
.prod-info{flex:1;}
.prod-name{font-size:15px;font-weight:500;}
.prod-sub{font-size:13px;color:var(--text2);margin-top:2px;}
.prod-btns{display:flex;gap:6px;}
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;}
.icon-btn:active{opacity:0.6;}
.icon-btn-edit{background:#f0f0f0;color:var(--text);}
.icon-btn-del{background:#fff0f0;color:var(--danger);}

/* SEARCH */
.search-container{position:relative;margin-bottom:16px;}
.search-input-wrap{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);display:flex;align-items:center;padding:11px 14px;gap:8px;}
.search-icon{color:var(--text3);font-size:16px;flex-shrink:0;}
.search-input-wrap input{font-size:15px;}
.search-results{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);position:absolute;width:100%;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.08);top:calc(100% + 6px);overflow:hidden;}
.search-item{padding:13px 16px;border-bottom:0.5px solid var(--border2);display:flex;justify-content:space-between;align-items:center;font-size:15px;}
.search-item:last-child{border-bottom:none;}
.search-item:active{background:#f5f5f5;}
.search-item-price{font-size:14px;color:var(--primary);font-weight:600;}

/* INVOICE HEADER */
.inv-top-grid{display:grid;grid-template-columns:60px 1fr 1fr;gap:1px;background:var(--border2);border-radius:var(--radius);overflow:hidden;border:0.5px solid var(--border);margin-bottom:16px;}
.inv-top-cell{background:var(--card);padding:11px 13px;}
.inv-top-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:3px;}
.inv-top-cell input{font-size:15px;font-weight:500;}

/* INVOICE TABLE */
.inv-table-wrap{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);overflow:hidden;margin-bottom:16px;}
.inv-table-header{display:grid;grid-template-columns:1fr 64px 56px 28px;padding:8px 14px;background:var(--bg);border-bottom:0.5px solid var(--border2);}
.inv-table-header span{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
.inv-row{display:grid;grid-template-columns:1fr 64px 56px 28px;padding:11px 14px;border-bottom:0.5px solid var(--border2);align-items:center;}
.inv-row:last-child{border-bottom:none;}
.inv-row-name{font-size:14px;font-weight:500;}
.inv-row-sku{font-size:12px;color:var(--text3);margin-top:1px;}
.qty-input{width:52px;padding:6px 8px!important;text-align:center;border:0.5px solid var(--border)!important;font-weight:600;margin:0!important;font-size:15px;border-radius:8px!important;background:var(--bg)!important;}
.inv-row-total{font-size:14px;font-weight:600;text-align:right;}
.inv-del-btn{width:24px;height:24px;border-radius:6px;border:none;background:none;color:var(--text3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-left:auto;}

/* TOTAL */
.total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-top:0.5px solid var(--border2);}
.total-label{font-size:15px;color:var(--text2);}
.total-amount{font-size:20px;font-weight:700;}

/* HISTORY */
.hist-item{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);padding:14px 16px;margin-bottom:10px;}
.hist-top{display:flex;justify-content:space-between;align-items:center;}
.hist-num{font-size:16px;font-weight:600;}
.hist-sum{font-size:16px;font-weight:600;color:var(--primary);}
.hist-meta{font-size:13px;color:var(--text2);margin-top:3px;}
.hist-btns{display:flex;gap:8px;margin-top:12px;}

/* TRUNK */
.trunk-summary{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);padding:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.trunk-summary-label{font-size:13px;color:var(--text2);font-weight:500;}
.trunk-summary-val{font-size:24px;font-weight:700;}

.trunk-item{background:var(--card);border-radius:var(--radius);border:0.5px solid var(--border);padding:14px 16px;margin-bottom:10px;user-select:none;-webkit-user-select:none;}
.trunk-name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.trunk-name{font-size:16px;font-weight:600;}
.trunk-qty-badge{background:var(--primary);color:#fff;font-size:14px;font-weight:700;padding:3px 10px;border-radius:20px;}
.trunk-controls{display:flex;gap:10px;margin-bottom:10px;}
.trunk-btn{flex:1;padding:13px;border:none;border-radius:10px;font-size:22px;font-weight:300;cursor:pointer;transition:opacity 0.15s;}
.trunk-btn:active{opacity:0.6;}
.trunk-btn-minus{background:#fff0f0;color:var(--danger);}
.trunk-btn-plus{background:#f0fff4;color:var(--green);}
.trunk-meta{display:flex;justify-content:space-between;align-items:center;}
.trunk-sku{font-size:12px;color:var(--text3);}
.trunk-line-total{font-size:15px;font-weight:600;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:flex-end;justify-content:center;z-index:2000;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.modal-sheet{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:8px 20px 40px;max-height:92vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 20px;}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;letter-spacing:-0.3px;}
.hidden{display:none;}

/* EDIT BANNER */
.edit-banner{background:var(--orange);color:#fff;padding:10px 14px;text-align:center;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:600;}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
.empty-state-text{font-size:15px;font-weight:500;}

/* TOAST */
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* PREVIEW */
.preview-nakl{font-family:-apple-system,sans-serif;}
.preview-nakl-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:4px;}
.preview-nakl-sub{font-size:13px;color:var(--text2);text-align:center;margin-bottom:16px;}
.preview-nakl-client{background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:16px;}
.preview-nakl-client-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:2px;}
.preview-nakl-client-val{font-size:15px;font-weight:600;}
.preview-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
.preview-table th{font-size:11px;color:var(--text3);padding:6px 4px;text-align:left;border-bottom:0.5px solid var(--border);}
.preview-table td{padding:10px 4px;border-bottom:0.5px solid var(--border2);font-size:14px;vertical-align:middle;}
.preview-total-row{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--text);color:#fff;border-radius:10px;}

.sortable-ghost{opacity:0.3;}
</style>
</head>
<body>

<div class="header">
  <div class="header-title" id="page-title">Склад</div>
  <div class="sync-dot" id="syncDot"></div>
</div>

<!-- СКЛАД -->
<div id="page-goods" class="page active">
  <div class="section-header">Новий товар</div>
  <div class="input-group">
    <input type="hidden" id="edit-id">
    <div class="input-row"><div class="input-label">Група</div><select id="g-cat"></select></div>
    <div class="input-row"><div class="input-label">Назва</div><input type="text" id="g-name" placeholder="Введіть назву"></div>
    <div class="input-row"><div class="input-label">Артикул</div><input type="text" id="g-sku" placeholder="Необов'язково"></div>
    <div class="input-row"><div class="input-label">Ціна ₴</div><input type="number" id="g-price" placeholder="0.00" inputmode="decimal"></div>
    <div class="input-row"><div class="input-label">Одиниця</div><input type="text" id="g-unit" placeholder="шт"></div>
  </div>
  <button class="btn btn-primary" onclick="saveProduct()">Зберегти товар</button>
  <button class="btn btn-ghost hidden" id="btn-cancel-edit" onclick="cancelEdit()" style="margin-top:8px">Скасувати редагування</button>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px;margin-bottom:8px">
    <div class="section-header" style="margin:0">Каталог</div>
    <button class="btn btn-ghost btn-sm" onclick="openCatManager()">Групи</button>
  </div>
  <div id="goods-container"></div>
</div>

<!-- НАКЛАДНА -->
<div id="page-invoice" class="page">
  <div id="edit-banner" class="edit-banner hidden">Редагування накладної</div>
  <div class="inv-top-grid">
    <div class="inv-top-cell"><div class="inv-top-label">№</div><input type="text" id="inv-num"></div>
    <div class="inv-top-cell"><div class="inv-top-label">Дата</div><input type="date" id="inv-date"></div>
    <div class="inv-top-cell"><div class="inv-top-label">Клієнт</div><input type="text" id="inv-client" placeholder="Ім'я"></div>
  </div>

  <div class="search-container">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="inv-search" placeholder="Пошук товару..." oninput="searchInv(this.value)">
    </div>
    <div id="inv-sres" class="search-results hidden"></div>
  </div>

  <div class="inv-table-wrap" id="inv-table-wrap">
    <div class="inv-table-header">
      <span>Назва</span><span style="text-align:center">К-сть</span><span style="text-align:right">Сума</span><span></span>
    </div>
    <div id="inv-items"></div>
    <div id="inv-tot-wrap" class="hidden">
      <div class="total-row">
        <span class="total-label">Разом</span>
        <span class="total-amount" id="inv-total-val">0 ₴</span>
      </div>
    </div>
  </div>

  <div id="inv-actions" class="hidden">
    <button class="btn btn-primary" onclick="openPreview()">Переглянути накладну →</button>
    <button class="btn btn-ghost hidden" id="btn-cancel-inv-edit" onclick="resetInvoicePage()" style="margin-top:8px">Скасувати редагування</button>
  </div>
</div>

<!-- ЖУРНАЛ -->
<div id="page-history" class="page">
  <div id="hist-list"></div>
</div>

<!-- БАГАЖНИК -->
<div id="page-trunk" class="page">
  <div class="trunk-summary">
    <div><div class="trunk-summary-label">Загальна вартість</div><div class="trunk-summary-val" id="trunk-total">0 ₴</div></div>
    <button class="btn btn-primary btn-sm" onclick="openTrunkAdd()">+ Додати</button>
  </div>
  <div id="trunk-list"></div>
</div>

<!-- NAV -->
<div class="nav-bar">
  <button class="nav-item active" onclick="showPage('goods',this)">
    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    Склад
  </button>
  <button class="nav-item" onclick="showPage('invoice',this)">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    <span id="nav-inv-label">Накладна</span>
  </button>
  <button class="nav-item" onclick="showPage('history',this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    Журнал
  </button>
  <button class="nav-item" onclick="showPage('trunk',this)">
    <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 4v4h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
    Багажник
  </button>
</div>

<!-- CAT MODAL -->
<div id="category-modal" class="modal-overlay hidden" onclick="closeCatIfOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Групи товарів</div>
    <div id="cat-manager-list" style="margin-bottom:16px"></div>
    <div class="search-input-wrap" style="margin-bottom:12px">
      <input type="text" id="new-cat-name" placeholder="Нова група..." style="font-size:15px">
    </div>
    <button class="btn btn-primary" onclick="addCategory()">Додати групу</button>
    <button class="btn btn-ghost" onclick="closeCatManager()" style="margin-top:8px">Закрити</button>
  </div>
</div>

<!-- PREVIEW MODAL -->
<div id="preview-modal" class="modal-overlay hidden">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div id="pre-content" class="preview-nakl"></div>
    <div style="display:flex;gap:8px;margin-top:20px">
      <button class="btn btn-ghost" onclick="closePreview()" style="flex:1">← Назад</button>
      <button class="btn btn-green" onclick="saveInvoice()" style="flex:1">Зберегти</button>
      <button class="btn btn-primary" onclick="openPDF()" style="flex:1">PDF ↗</button>
    </div>
  </div>
</div>

<!-- TRUNK ADD MODAL -->
<div id="trunk-modal" class="modal-overlay hidden" onclick="closeTrunkIfOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">Додати в багажник</div>
    <div class="search-container">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="trunk-search" placeholder="Пошук..." oninput="searchTrunk(this.value)" style="font-size:15px">
      </div>
      <div id="trunk-sres" class="search-results hidden"></div>
    </div>
    <button class="btn btn-ghost" onclick="closeTrunkModal()" style="margin-top:8px">Закрити</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig={apiKey:"AIzaSyBqEFr1Zl-uM-eb58tB_tMgYIgISsfKoiM",authDomain:"crmkyrylin.firebaseapp.com",databaseURL:"https://crmkyrylin-default-rtdb.europe-west1.firebasedatabase.app",projectId:"crmkyrylin",storageBucket:"crmkyrylin.firebasestorage.app",messagingSenderId:"855766374550",appId:"1:855766374550:web:337edb41aa7ce2ab274ab7"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let products=[],categories=["Тенти","Бар'єри","Безпека","Без категорії"];
let invoiceItems=[],invoiceHistory=[],editingInvoiceId=null;
let collapsedCats={},currentInvoiceData=null,trunkItems={};

// SYNC
db.ref('products').on('value',snap=>{products=snap.val()?Object.values(snap.val()).sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0)):[];renderGoods();});
db.ref('categories').on('value',snap=>{if(snap.val())categories=snap.val();renderGoods();});
db.ref('history').on('value',snap=>{invoiceHistory=snap.val()?Object.values(snap.val()).sort((a,b)=>b.id-a.id):[];renderHistory();});
db.ref('trunk').on('value',snap=>{trunkItems=snap.val()||{};renderTrunk();});
db.ref('.info/connected').on('value',snap=>{
  const dot=document.getElementById('syncDot');
  dot.className=snap.val()?'sync-dot':'sync-dot offline';
});

// СКЛАД
function renderGoods(){
  const container=document.getElementById('goods-container');
  container.innerHTML='';
  const sel=document.getElementById('g-cat');
  const prev=sel.value;
  sel.innerHTML=categories.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(prev)sel.value=prev;

  categories.forEach((cat,ci)=>{
    const catProds=products.filter(p=>(p.cat||'Без категорії')===cat);
    if(!catProds.length)return;
    const sec=document.createElement('div');sec.className='cat-section';
    const title=document.createElement('div');title.className='cat-title';
    title.innerHTML=`<span>${cat}</span><span class="cat-title-count">${catProds.length}</span>`;
    const list=document.createElement('div');list.id=`cl-${ci}`;
    if(collapsedCats[cat])list.classList.add('hidden');
    title.onclick=()=>{list.classList.toggle('hidden');collapsedCats[cat]=list.classList.contains('hidden');};
    catProds.forEach(p=>{
      const el=document.createElement('div');el.className='prod-item';el.dataset.id=p.id;
      el.innerHTML=`<span class="drag-handle">⠿</span><div class="prod-info"><div class="prod-name">${p.name}</div><div class="prod-sub">${p.price} ₴${p.sku?' · '+p.sku:''} · ${p.unit||'шт'}</div></div><div class="prod-btns"><button class="icon-btn icon-btn-edit" onclick="event.stopPropagation();editProd('${p.id}')">✏️</button><button class="icon-btn icon-btn-del" onclick="event.stopPropagation();deleteProd('${p.id}')">✕</button></div>`;
      list.appendChild(el);
    });
    sec.appendChild(title);sec.appendChild(list);container.appendChild(sec);
    new Sortable(list,{handle:'.drag-handle',animation:150,ghostClass:'sortable-ghost',onEnd:saveOrder});
  });
}

function saveOrder(){document.querySelectorAll('#goods-container .prod-item').forEach((el,i)=>db.ref('products/'+el.dataset.id).update({sortOrder:i}));}

function saveProduct(){
  const id=document.getElementById('edit-id').value||Date.now().toString();
  const name=document.getElementById('g-name').value.trim();
  const price=parseFloat(document.getElementById('g-price').value);
  if(!name||isNaN(price))return;
  const existing=products.find(x=>x.id===id);
  db.ref('products/'+id).update({id,name,price,unit:document.getElementById('g-unit').value||'шт',sku:document.getElementById('g-sku').value,cat:document.getElementById('g-cat').value,sortOrder:existing?(existing.sortOrder||0):products.length});
  cancelEdit();showToast('Товар збережено');
}

function deleteProd(id){if(confirm('Видалити товар?'))db.ref('products/'+id).remove();}

function editProd(id){
  const p=products.find(x=>x.id==id);
  document.getElementById('edit-id').value=p.id;
  document.getElementById('g-name').value=p.name;
  document.getElementById('g-price').value=p.price;
  document.getElementById('g-sku').value=p.sku||'';
  document.getElementById('g-unit').value=p.unit||'шт';
  document.getElementById('g-cat').value=p.cat;
  document.getElementById('btn-cancel-edit').classList.remove('hidden');
  showPage('goods',document.querySelectorAll('.nav-item')[0]);
  window.scrollTo(0,0);
}

function cancelEdit(){
  ['edit-id','g-name','g-price','g-sku'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('g-unit').value='шт';
  document.getElementById('btn-cancel-edit').classList.add('hidden');
}

// КАТЕГОРІЇ
function openCatManager(){
  document.getElementById('cat-manager-list').innerHTML=categories.map(c=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:0.5px solid var(--border2)">
      <span style="font-size:15px">${c}</span>
      <button class="icon-btn icon-btn-del" onclick="deleteCat('${c}')">✕</button>
    </div>`).join('');
  document.getElementById('category-modal').classList.remove('hidden');
}
function addCategory(){
  const n=document.getElementById('new-cat-name').value.trim();
  if(n&&!categories.includes(n)){categories.push(n);db.ref('categories').set(categories);document.getElementById('new-cat-name').value='';openCatManager();}
}
function deleteCat(c){if(confirm('Видалити групу?')){categories=categories.filter(x=>x!==c);db.ref('categories').set(categories);openCatManager();}}
function closeCatManager(){document.getElementById('category-modal').classList.add('hidden');}
function closeCatIfOutside(e){if(e.target===document.getElementById('category-modal'))closeCatManager();}

// НАКЛАДНА
function searchInv(val){
  const res=document.getElementById('inv-sres');
  if(!val){res.classList.add('hidden');return;}
  const f=products.filter(p=>p.name.toLowerCase().includes(val.toLowerCase())||(p.sku&&p.sku.toLowerCase().includes(val.toLowerCase())));
  if(!f.length){res.innerHTML='<div style="padding:16px;text-align:center;color:var(--text3);font-size:14px">Не знайдено</div>';res.classList.remove('hidden');return;}
  res.innerHTML=f.map(p=>`<div class="search-item" onclick="addInvItem('${p.id}')"><div><div>${p.name}</div>${p.sku?'<div style="font-size:12px;color:var(--text3)">'+p.sku+'</div>':''}</div><span class="search-item-price">${p.price} ₴</span></div>`).join('');
  res.classList.remove('hidden');
}

document.addEventListener('click',e=>{if(!e.target.closest('.search-container'))document.getElementById('inv-sres').classList.add('hidden');});

function addInvItem(id){
  const p=products.find(x=>x.id==id);
  invoiceItems.push({...p,tempId:Date.now(),qty:1});
  document.getElementById('inv-search').value='';
  document.getElementById('inv-sres').classList.add('hidden');
  renderInvoice();updateNavLabel();
}

function renderInvoice(){
  const body=document.getElementById('inv-items');
  if(!invoiceItems.length){body.innerHTML='';document.getElementById('inv-tot-wrap').classList.add('hidden');document.getElementById('inv-actions').classList.add('hidden');return;}
  body.innerHTML=invoiceItems.map(it=>`
    <div class="inv-row" data-tid="${it.tempId}">
      <div><div class="inv-row-name">${it.name}</div>${it.sku?'<div class="inv-row-sku">'+it.sku+'</div>':''}</div>
      <div style="text-align:center"><input type="number" class="qty-input" value="${it.qty}" inputmode="decimal" oninput="updateQty(${it.tempId},this.value)"></div>
      <div class="inv-row-total">${(it.price*it.qty).toFixed(0)}</div>
      <button class="inv-del-btn" onclick="removeInvItem(${it.tempId})">×</button>
    </div>`).join('');
  document.getElementById('inv-tot-wrap').classList.remove('hidden');
  document.getElementById('inv-actions').classList.remove('hidden');
  updateInvoiceTotal();
  new Sortable(body,{animation:150,onEnd:evt=>{const m=invoiceItems.splice(evt.oldIndex,1)[0];invoiceItems.splice(evt.newIndex,0,m);}});
}

function updateQty(tid,val){
  const it=invoiceItems.find(x=>x.tempId==tid);
  if(it){
    it.qty=parseFloat(val)||0;
    const row=document.querySelector(`.inv-row[data-tid="${tid}"]`);
    if(row)row.querySelector('.inv-row-total').innerText=(it.price*it.qty).toFixed(0);
    updateInvoiceTotal();
  }
}

function updateInvoiceTotal(){
  const total=invoiceItems.reduce((s,x)=>s+(x.price*x.qty),0);
  document.getElementById('inv-total-val').innerText=total.toFixed(2)+' ₴';
}

function removeInvItem(tid){invoiceItems=invoiceItems.filter(x=>x.tempId!=tid);renderInvoice();updateNavLabel();}
function updateNavLabel(){document.getElementById('nav-inv-label').textContent=invoiceItems.length>0?`Накладна (${invoiceItems.length})`:'Накладна';}

// PREVIEW
function openPreview(){
  const num=document.getElementById('inv-num').value||'1';
  const dateRaw=document.getElementById('inv-date').value;
  const date=dateRaw.split('-').reverse().join('.');
  const client=document.getElementById('inv-client').value||'—';
  const total=invoiceItems.reduce((s,x)=>s+x.price*x.qty,0);
  currentInvoiceData={num,date,client,total,items:invoiceItems.map(x=>({...x})),id:editingInvoiceId||Date.now().toString()};

  let rows='';
  currentInvoiceData.items.forEach((it,i)=>{
    rows+=`<tr><td style="padding:10px 4px;border-bottom:0.5px solid var(--border2);font-size:14px">${it.name}${it.sku?'<br><span style="font-size:11px;color:var(--text3)">'+it.sku+'</span>':''}</td><td style="padding:10px 4px;border-bottom:0.5px solid var(--border2);text-align:center;font-size:14px;white-space:nowrap">${it.qty} ${it.unit||'шт'}</td><td style="padding:10px 4px;border-bottom:0.5px solid var(--border2);text-align:right;font-size:14px;font-weight:600;white-space:nowrap">${(it.qty*it.price).toFixed(0)} ₴</td></tr>`;
  });

  document.getElementById('pre-content').innerHTML=`
    <div class="preview-nakl-title">Видаткова накладна</div>
    <div class="preview-nakl-sub">№ ${num} · ${date}</div>
    <div class="preview-nakl-client">
      <div class="preview-nakl-client-label">Отримувач</div>
      <div class="preview-nakl-client-val">${client}</div>
    </div>
    <table class="preview-table">
      <thead><tr><th>Назва</th><th style="text-align:center;width:64px">К-сть</th><th style="text-align:right;width:72px">Сума</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="preview-total-row">
      <span style="font-size:15px;font-weight:500">Разом</span>
      <span style="font-size:20px;font-weight:700">${total.toFixed(2)} ₴</span>
    </div>`;
  document.getElementById('preview-modal').classList.remove('hidden');
}

function closePreview(){document.getElementById('preview-modal').classList.add('hidden');}

function saveInvoice(){
  if(!currentInvoiceData)return;
  db.ref('history/'+currentInvoiceData.id).set(currentInvoiceData);
  if(!editingInvoiceId)document.getElementById('inv-num').value=parseInt(currentInvoiceData.num)+1;
  resetInvoicePage();closePreview();
  showPage('history',document.querySelectorAll('.nav-item')[2]);
  showToast('Накладну збережено');
}

function openPDF(){
  if(!currentInvoiceData)return;
  db.ref('history/'+currentInvoiceData.id).set(currentInvoiceData);
  if(!editingInvoiceId)document.getElementById('inv-num').value=parseInt(currentInvoiceData.num)+1;

  const dd={
    pageSize:'A4',pageMargins:[40,40,40,40],
    content:[
      {text:'ВИДАТКОВА НАКЛАДНА',fontSize:18,bold:true,alignment:'center',margin:[0,0,0,6]},
      {text:`№ ${currentInvoiceData.num} від ${currentInvoiceData.date}`,fontSize:12,alignment:'center',color:'#666',margin:[0,0,0,20]},
      {table:{widths:['auto','*'],body:[[{text:'Отримувач:',bold:true,border:[0,0,0,0]},{text:currentInvoiceData.client,border:[0,0,0,0]}]]},layout:'noBorders',margin:[0,0,0,20]},
      {table:{headerRows:1,widths:[20,40,'*',55,55,65],body:[
        [{text:'№',bold:true,fillColor:'#f5f5f5',alignment:'center'},{text:'Арт.',bold:true,fillColor:'#f5f5f5'},{text:'Назва',bold:true,fillColor:'#f5f5f5'},{text:'К-сть',bold:true,fillColor:'#f5f5f5',alignment:'center'},{text:'Ціна',bold:true,fillColor:'#f5f5f5',alignment:'right'},{text:'Сума',bold:true,fillColor:'#f5f5f5',alignment:'right'}],
        ...currentInvoiceData.items.map((it,i)=>[{text:i+1,alignment:'center'},it.sku||'—',it.name,{text:`${it.qty} ${it.unit||'шт'}`,alignment:'center'},{text:it.price.toFixed(2),alignment:'right'},{text:(it.qty*it.price).toFixed(2),alignment:'right'}])
      ]},layout:'lightHorizontalLines'},
      {text:`\nРАЗОМ: ${currentInvoiceData.total.toFixed(2)} грн`,fontSize:14,bold:true,alignment:'right',margin:[0,10,0,0]}
    ],
    defaultStyle:{fontSize:11}
  };

  pdfMake.createPdf(dd).getBase64(base64=>{
    const byteChars=atob(base64);
    const byteArr=new Uint8Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++)byteArr[i]=byteChars.charCodeAt(i);
    const blob=new Blob([byteArr],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    window.location.href=url;
    resetInvoicePage();closePreview();
    showPage('history',document.querySelectorAll('.nav-item')[2]);
    showToast('PDF готово');
  });
}

// ЖУРНАЛ
function renderHistory(){
  const list=document.getElementById('hist-list');
  if(!invoiceHistory.length){
    list.innerHTML='<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">Накладних поки немає</div></div>';
    return;
  }
  list.innerHTML=invoiceHistory.map(h=>`
    <div class="hist-item">
      <div class="hist-top">
        <span class="hist-num">№${h.num} — ${h.client}</span>
        <span class="hist-sum">${parseFloat(h.total).toFixed(0)} ₴</span>
      </div>
      <div class="hist-meta">${h.date} · ${h.items.length} позицій</div>
      <div class="hist-btns">
        <button class="btn btn-ghost btn-sm" onclick="editHistory('${h.id}')" style="flex:1">Редагувати</button>
        <button class="btn btn-primary btn-sm" onclick="histPDF('${h.id}')" style="flex:1">PDF ↗</button>
        <button class="icon-btn icon-btn-del" onclick="deleteHistory('${h.id}')" style="flex-shrink:0">🗑️</button>
      </div>
    </div>`).join('');
}

function editHistory(id){
  const h=invoiceHistory.find(x=>x.id==id);
  if(!h)return;
  editingInvoiceId=h.id;
  document.getElementById('inv-num').value=h.num;
  document.getElementById('inv-client').value=h.client;
  document.getElementById('inv-date').value=h.date.split('.').reverse().join('-');
  invoiceItems=h.items.map(it=>({...it,tempId:Math.random()}));
  document.getElementById('edit-banner').classList.remove('hidden');
  document.getElementById('btn-cancel-inv-edit').classList.remove('hidden');
  showPage('invoice',document.querySelectorAll('.nav-item')[1]);
  renderInvoice();updateNavLabel();
}

function histPDF(id){
  const h=invoiceHistory.find(x=>x.id==id);
  if(!h)return;
  const total=h.items.reduce((s,x)=>s+x.price*x.qty,0);
  currentInvoiceData={num:h.num,date:h.date,client:h.client,total,items:h.items.map(x=>({...x})),id:h.id};
  let rows='';
  currentInvoiceData.items.forEach(it=>{rows+=`<tr><td style="padding:10px 4px;border-bottom:0.5px solid var(--border2);font-size:14px">${it.name}${it.sku?'<br><span style="font-size:11px;color:var(--text3)">'+it.sku+'</span>':''}</td><td style="padding:10px 4px;border-bottom:0.5px solid var(--border2);text-align:center;font-size:14px;white-space:nowrap">${it.qty} ${it.unit||'шт'}</td><td style="padding:10px 4px;border-bottom:0.5px solid var(--border2);text-align:right;font-size:14px;font-weight:600;white-space:nowrap">${(it.qty*it.price).toFixed(0)} ₴</td></tr>`;});
  document.getElementById('pre-content').innerHTML=`
    <div class="preview-nakl-title">Видаткова накладна</div>
    <div class="preview-nakl-sub">№ ${h.num} · ${h.date}</div>
    <div class="preview-nakl-client"><div class="preview-nakl-client-label">Отримувач</div><div class="preview-nakl-client-val">${h.client}</div></div>
    <table class="preview-table"><thead><tr><th>Назва</th><th style="text-align:center;width:64px">К-сть</th><th style="text-align:right;width:72px">Сума</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="preview-total-row"><span style="font-size:15px;font-weight:500">Разом</span><span style="font-size:20px;font-weight:700">${total.toFixed(2)} ₴</span></div>`;
  document.getElementById('preview-modal').classList.remove('hidden');
}

function deleteHistory(id){if(confirm('Видалити накладну?'))db.ref('history/'+id).remove();}

function resetInvoicePage(){
  editingInvoiceId=null;invoiceItems=[];
  document.getElementById('inv-client').value='';
  document.getElementById('inv-search').value='';
  document.getElementById('edit-banner').classList.add('hidden');
  document.getElementById('btn-cancel-inv-edit').classList.add('hidden');
  renderInvoice();updateNavLabel();
}

// БАГАЖНИК
function renderTrunk(){
  const list=document.getElementById('trunk-list');
  const keys=Object.keys(trunkItems);
  if(!keys.length){
    list.innerHTML='<div class="empty-state"><div class="empty-state-icon">🚗</div><div class="empty-state-text">Багажник порожній</div></div>';
    document.getElementById('trunk-total').textContent='0 ₴';return;
  }
  let total=0;
  list.innerHTML=keys.map(pid=>{
    const ti=trunkItems[pid];
    const p=products.find(x=>x.id==pid)||ti;
    const lineTotal=p.price*ti.qty;total+=lineTotal;
    return `<div class="trunk-item">
      <div class="trunk-name-row">
        <div class="trunk-name">${p.name}</div>
        <div class="trunk-qty-badge">${ti.qty} ${p.unit||'шт'}</div>
      </div>
      <div class="trunk-controls">
        <button class="trunk-btn trunk-btn-minus" onclick="trunkChange('${pid}',-1)">−</button>
        <button class="trunk-btn trunk-btn-plus" onclick="trunkChange('${pid}',1)">+</button>
      </div>
      <div class="trunk-meta">
        <span class="trunk-sku">${p.sku?'Арт: '+p.sku+' · ':''}${p.price} ₴/шт</span>
        <span class="trunk-line-total">${lineTotal.toFixed(0)} ₴</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('trunk-total').textContent=total.toFixed(0)+' ₴';
}

function trunkChange(pid,delta){
  const ti=trunkItems[pid];if(!ti)return;
  const newQty=Math.max(0,(ti.qty||0)+delta);
  if(newQty===0){if(confirm('Видалити з багажника?'))db.ref('trunk/'+pid).remove();}
  else db.ref('trunk/'+pid).update({qty:newQty});
}

function openTrunkAdd(){document.getElementById('trunk-modal').classList.remove('hidden');}
function closeTrunkModal(){document.getElementById('trunk-modal').classList.add('hidden');document.getElementById('trunk-search').value='';document.getElementById('trunk-sres').classList.add('hidden');}
function closeTrunkIfOutside(e){if(e.target===document.getElementById('trunk-modal'))closeTrunkModal();}

function searchTrunk(val){
  const res=document.getElementById('trunk-sres');
  if(!val){res.classList.add('hidden');return;}
  const f=products.filter(p=>p.name.toLowerCase().includes(val.toLowerCase())||(p.sku&&p.sku.toLowerCase().includes(val.toLowerCase())));
  res.innerHTML=f.map(p=>`<div class="search-item" onclick="addToTrunk('${p.id}')"><div><div>${p.name}</div>${p.sku?'<div style="font-size:12px;color:var(--text3)">'+p.sku+'</div>':''}</div><span class="search-item-price">${p.price} ₴</span></div>`).join('');
  res.classList.remove('hidden');
}

function addToTrunk(pid){
  const p=products.find(x=>x.id==pid);if(!p)return;
  const existing=trunkItems[pid];
  db.ref('trunk/'+pid).set({name:p.name,price:p.price,sku:p.sku||'',unit:p.unit||'шт',qty:(existing?existing.qty:0)+1});
  closeTrunkModal();showToast('Додано в багажник');
}

// NAV
function showPage(p,btn){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(btn)btn.classList.add('active');
  document.getElementById('page-title').innerText={goods:'Склад',invoice:'Накладна',history:'Журнал',trunk:'Багажник'}[p];
}

function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

const _n=new Date();
document.getElementById('inv-date').value=_n.toISOString().split('T')[0];
document.getElementById('inv-num').value=String(_n.getDate()).padStart(2,'0')+String(_n.getMonth()+1).padStart(2,'0');
</script>
